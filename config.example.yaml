# lab-cloud-manager configuration.
# Copy to config.yaml (gitignored) and run:
#   go run ./cmd/server -config ../config.yaml
# Every value can also be set via env vars (LCM_*), which take precedence.

listen: 127.0.0.1:8080          # LCM_LISTEN

database:
  driver: sqlite                # LCM_DB_DRIVER — "sqlite" now, "postgres" planned
  dsn: labcloud.db              # LCM_DB_DSN

# Hypervisor backend: "mock" (development, no cluster needed) or "proxmox"
driver: mock                    # LCM_DRIVER

proxmox:
  baseUrl: https://pve.example.lan:8006   # LCM_PROXMOX_URL
  # Create under Datacenter → Permissions → API Tokens.
  # Token needs VM.* privileges on the VMs/nodes it manages.
  tokenId: root@pam!labcloud              # LCM_PROXMOX_TOKEN_ID
  secret: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # LCM_PROXMOX_SECRET
  insecureSkipVerify: true                # self-signed certs

# The browser terminal.
ssh:
  # Create the console's login on a guest that has never seen its key,
  # through the hypervisor's guest agent — so Connect works on VMs this
  # console adopted rather than created. Only ever runs after an
  # authentication failure. Needs VM.Monitor on the Proxmox token.
  provision: true               # LCM_SSH_PROVISION
  # Give that account passwordless sudo. Off by default on purpose:
  # the console signs in as an ordinary user so sudo still asks the
  # question that makes you think.
  provisionSudo: false          # LCM_SSH_PROVISION_SUDO

# The first account, seeded on first run only. After that, accounts are
# managed in IAM & Admin and these settings are ignored.
auth:
  bootstrapEmail: lab@localhost   # LCM_AUTH_BOOTSTRAP_EMAIL
  # Leave empty and one is generated and printed to the log at startup —
  # better a password in your scrollback than a default everyone knows.
  bootstrapPassword: ''           # LCM_AUTH_BOOTSTRAP_PASSWORD
