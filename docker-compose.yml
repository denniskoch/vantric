# The app: one image holding the API and the built UI, on :8080.
#
#   make up   build and run it
#
# Settings come from .env — see .env.example. Docker builds and runs the
# app; to work on the code, use `make dev`, which runs both halves on
# your machine.
services:
  app:
    # Named, so it's the same container wherever this is checked out —
    # compose otherwise derives it from the directory, and this repo
    # lives at ~/…/vantric on one machine and
    # /opt/cloud-console on another.
    container_name: cloud-console
    build: .
    # Passed whole, so a new setting works without also being listed
    # here. A missing .env is fine: every setting has a default.
    env_file:
      - path: .env
        required: false
    volumes:
      # A directory rather than a named volume: the whole state of this
      # app is one SQLite file, and a file you can see is a file you can
      # copy. Back up ./data — it holds your accounts, every backend
      # credential and each account's SSH private key, so treat it as a
      # secret.
      - ./data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Reaching the console from outside the lab, without opening a port.
  # The tunnel is created in Cloudflare Zero Trust and points at
  # http://app:8080 over this network; the app's published port stays
  # for reaching it on the LAN.
  #
  # Needs TUNNEL_TOKEN in .env. Without one this container restarts in a
  # loop and the app carries on regardless — noisy, but visible, which
  # beats a service that quietly isn't there.
  #
  # PUT ACCESS IN FRONT OF IT. This console holds credentials for every
  # backend in your lab and can open a root-capable shell on your
  # guests; a Zero Trust policy is what stands between that and the
  # public internet.
  cloudflared:
    container_name: cloud-console-tunnel
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - app
    restart: unless-stopped
