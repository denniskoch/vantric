# The app: one image holding the API and the built UI, on :8080.
#
#   make up   build and run it
#
# Settings come from .env — see .env.example. Docker builds and runs the
# app; to work on the code, use `make dev`, which runs both halves on
# your machine.
services:
  app:
    # Named, so it's the same container wherever this is checked out —
    # compose otherwise derives it from the directory, and this repo
    # lives at ~/…/vantric on one machine and
    # /opt/vantric on another.
    container_name: vantric
    build:
      context: .
    # Passed whole, so a new setting works without also being listed
    # here. A missing .env is fine: every setting has a default.
    env_file:
      - path: .env
        required: false
    volumes:
      # A directory rather than a named volume: the whole state of this
      # app is one SQLite file, and a file you can see is a file you can
      # copy. Back up ./data — it holds your accounts, every backend
      # credential and each account's SSH private key, so treat it as a
      # secret.
      - ./data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped

  # The thing that speaks RDP and VNC, so a desktop can be proxied into
  # the browser the way a terminal already is. The console talks to it
  # over this network; guacd does the protocol and hands back a stream
  # the page renders. It holds no state and reads no config file.
  #
  # NO PUBLISHED PORT, AND THAT IS THE WHOLE ACCESS CONTROL. guacd has
  # no authentication of its own: anything that can reach 4822 can ask
  # it to connect to any host with any credentials it supplies. Reaching
  # it only from this compose network is what stands between that and
  # your LAN — do not add a `ports:` entry to debug something.
  #
  # No depends_on either way. The console connects when somebody asks
  # for a desktop, so a guacd that isn't running is a failed connect
  # with a reason, not a console that won't start — the same tolerance
  # it has for any unreachable backend.
  guacd:
    container_name: vantric-guacd
    # Pinned by the MULTI-ARCH manifest digest, same rule as the tunnel
    # below: the tag is there to be read, the digest is what binds, and
    # this one still runs on an arm64 host and an amd64 one. 1.6.0 is
    # the current stable (June 2025).
    # Tags: https://hub.docker.com/r/guacamole/guacd/tags
    image: guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
    restart: unless-stopped
    env_file:
      - path: .env
        required: false

# NOTHING HERE PUBLISHES THIS. How the console is reached from outside
# the lab is your choice — a Cloudflare Tunnel, Caddy, nginx, Traefik,
# Tailscale — and shipping one of them in the file everybody runs would
# be picking for you and leaving the rest to delete it. Point whichever
# you use at this app on the compose network, or at the published port
# above, and set VANTRIC_SITE_URL and VANTRIC_TRUSTED_PROXIES when you
# do. See "Reaching it from outside the lab" in the README.
