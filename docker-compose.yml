# Dev:  docker compose --profile dev up
#   backend hot-reload (air) on :8080, frontend HMR (vite) on :5173
# Prod: docker compose --profile prod up --build
#   single image (API + built UI) on :8080
services:
  backend-dev:
    profiles: [dev]
    image: golang:1.26-alpine
    working_dir: /src/backend
    command: go run github.com/air-verse/air@v1.63.0 -c .air.toml
    # Your settings, whole — no per-variable list to keep in step.
    env_file:
      - path: .env
        required: false
    environment:
      # These two win over .env, because they describe the container
      # rather than a preference: the default listen address is
      # 127.0.0.1, which nothing outside could reach, and the default DSN
      # is relative — it would put the database in the bind-mounted repo.
      LCM_LISTEN: 0.0.0.0:8080
      LCM_DB_DSN: /data/labcloud.db
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - dev-data:/data
    ports:
      - "8080:8080"

  frontend-dev:
    profiles: [dev]
    image: node:22-alpine
    working_dir: /src/frontend
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      # Read by vite.config.ts; without it the proxy points at 127.0.0.1,
      # which in this container is the frontend itself.
      LCM_API_TARGET: http://backend-dev:8080
    volumes:
      - .:/src
      # keep container node_modules separate from the host's (different OS)
      - node-modules:/src/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend-dev

  app:
    profiles: [prod]
    build: .
    # See .env.example. Passing the file whole means a new setting works
    # without also being added to a list here — which is how the
    # bootstrap password silently went missing before.
    env_file:
      - path: .env
        required: false
    volumes:
      - app-data:/data
    ports:
      - "8080:8080"

volumes:
  go-mod:
  go-build:
  node-modules:
  dev-data:
  app-data:
