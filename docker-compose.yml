# The app: one image holding the API and the built UI, on :8080.
#
#   docker compose up -d --build
#
# Settings come from .env — see .env.example. To work on the code
# instead, run the other file (docker-compose.dev.yml) rather than
# switching anything in here.
services:
  app:
    build: .
    # Passed whole, so a new setting works without also being listed
    # here. A missing .env is fine: every setting has a default.
    env_file:
      - path: .env
        required: false
    volumes:
      - app-data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  # Accounts, every backend credential, and each account's SSH private
  # key. Back it up, and treat it as a secret.
  app-data:
